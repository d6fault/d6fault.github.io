<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D6fault | Blog</title>
<meta name="description" content="Security research write-ups by D6fault: vulnerability analysis, firmware exploitation, and responsible disclosure.">
<link rel="me" href="https://www.youtube.com/@D6faultCTF">
<style>
:root {
    --bg: #050505;
    --panel: #0d0d0d;
    --line: #1c1c1c;
    --line-2: #2a2a2a;
    --text: #f5f5f5;
    --muted: #a3a3a3;
    --dim: #5c5c5c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
}
::selection { background: #fff; color: #000; }
a { color: inherit; }
main { max-width: 800px; margin: 0 auto; padding: 70px 28px 0; }
.back-link {
    color: var(--dim);
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-decoration: none;
    transition: 0.15s;
}
.back-link:hover { color: #fff; }
h1 {
    font-size: clamp(1.6rem, 4vw, 2.3rem);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.3;
    margin-bottom: 34px;
}
.post-row {
    display: grid;
    grid-template-columns: 110px 1fr auto;
    gap: 30px;
    align-items: baseline;
    padding: 30px 14px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 6px;
    transition: 0.15s;
}
.post-row:hover { border-color: var(--line-2); padding-left: 20px; }
.post-row .date { color: var(--dim); font-size: 0.8rem; }
.post-row h3 { font-size: 1.02rem; font-weight: 400; line-height: 1.5; }
.post-row h3 a { text-decoration: none; transition: 0.15s; }
.post-row h3 a:hover { color: var(--dim); }
.post-row .tags { color: var(--dim); font-size: 0.72rem; letter-spacing: 1px; }
footer {
    text-align: center;
    color: var(--dim);
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 60px 0;
}
@media (max-width: 640px) {
    .post-row { grid-template-columns: 1fr; gap: 8px; }
}
</style>
</head>
<body>
<main>
    <a class="back-link" href="/">&larr; index</a>
    <h1><span style="color:var(--dim)">/</span> blog</h1>
    <div class="post-row">
        <span class="date">2026.09.18</span>
        <h3><a href="dlink-dap1360-os-command-injection.html">OS Command Injection in D-Link DAP-1360 formSystemCheck Handler</a></h3>
        <span class="tags">firmware / cmdi / dlink</span>
    </div>
</main>
<footer>&copy; 2026 &mdash; d6fault</footer>
</body>
</html>
